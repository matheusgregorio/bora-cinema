name: Atualizar horários

on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 em São Paulo
    - cron: "17 15 * * *"  # 12:17 em São Paulo (pega mudanças de última hora)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-horarios
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar horários do dia
        run: python update_sessions.py
      - name: Salvar e publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sessions.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Horários de $(TZ=America/Sao_Paulo date +%d/%m)"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages vai publicar sozinho."
          fi
